<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Círculo COPARMEX | Vinculación Empresarial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0a1f44, #050b1a);
      color: #ffffff;
      overflow-x: hidden;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo img {
      height: 40px;
    }

    .nav-buttons button {
      margin-left: 15px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #2f80ed;
      color: #2f80ed;
    }

    .btn-outline:hover {
      background: #2f80ed;
      color: white;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2f80ed, #56ccf2);
      color: white;
      box-shadow: 0 4px 20px rgba(47,128,237,0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(47,128,237,0.6);
    }

    /* HERO */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 85vh;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      max-width: 900px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #cbd5e1;
      max-width: 700px;
      margin-bottom: 40px;
    }

    .hero-buttons button {
      margin: 10px;
      padding: 15px 30px;
      font-size: 1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .hero .btn-main {
      background: linear-gradient(135deg, #2f80ed, #56ccf2);
      color: white;
      box-shadow: 0 6px 30px rgba(47,128,237,0.5);
    }

    .hero .btn-main:hover {
      transform: scale(1.05);
    }

    .hero .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
    }

    .hero .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

  </style>

  <script>
    function enConstruccion() {
      alert("Esta funcionalidad está en construcción.");
    }
  </script>

</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">
      <img src="https://share.google/1tfBhYqYGHBM2ebdK" alt="COPARMEX Logo">
    </div>

    <div class="nav-buttons">
      <button class="btn-outline" onclick="enConstruccion()">Acceso</button>
      <button class="btn-primary" onclick="enConstruccion()">Entrar al Sistema</button>
    </div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <h1>
      La vinculación empresarial dejó de ser casual.<br>
      Ahora es un sistema.
    </h1>

    <p>
      Plataforma de articulación estratégica que conecta empresas, instituciones y oportunidades con precisión.
      No es networking. Es diseño de relaciones que generan resultados.
    </p>

    <div class="hero-buttons">
      <button class="btn-main" onclick="enConstruccion()">Entrar al Sistema</button>
      <button class="btn-secondary" onclick="enConstruccion()">Explorar el Proyecto</button>
    </div>
  </section>

  <!-- FOOTER -->
  <div class="footer">
    Círculo COPARMEX de Vinculación Empresarial © 2026
  </div>

</body>
</html>
